# Aggiorna API e database sulla VM Oracle Always Free a ogni push su main che tocca l'API.
# Si attiva solo dopo aver impostato la variabile VM_HOST e i secret VM_SSH_KEY,
# POSTGRES_PASSWORD, JWT_SECRET e GEMINI_API_KEY. Vedi README → "Deploy".
name: Deploy backend

on:
  push:
    branches: [main]
    paths: [apps/api/**, deploy/**, .github/workflows/deploy-backend.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP: dressit
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
      API_HOST: ${{ vars.API_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Chiave SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Configurazione dell'app
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || 'https://lorenzomp7.github.io' }}
        run: |
          [ -n "$API_HOST" ] || API_HOST="$APP.${VM_HOST//./-}.sslip.io"
          umask 077
          : > deploy/.env
          put() { printf "%s='%s'\n" "$1" "$2" >> deploy/.env; }
          put POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
          put JWT_SECRET "$JWT_SECRET"
          put GEMINI_API_KEY "$GEMINI_API_KEY"
          put CLOUDINARY_URL "$CLOUDINARY_URL"
          put ADMIN_EMAILS "$ADMIN_EMAILS"
          put GEMINI_MODEL "${GEMINI_MODEL:-gemini-3.8-flash}"
          put CORS_ORIGIN "$CORS_ORIGIN"
          put PUBLIC_API_URL "https://$API_HOST"
          printf '%s {\n\treverse_proxy dressit-api:4000\n}\n' "$API_HOST" > deploy/site.caddy
          echo "Indirizzo dell'API: https://$API_HOST"
      - name: Copia sulla VM e avvia
        run: |
          SSH="ssh -i $HOME/.ssh/id_vm"
          $SSH "$VM_USER@$VM_HOST" "sudo mkdir -p /opt/apps/$APP && sudo chown \$USER /opt/apps/$APP && (command -v rsync >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq rsync))"
          rsync -azR --delete -e "$SSH" --exclude node_modules --exclude dist apps/api deploy "$VM_USER@$VM_HOST:/opt/apps/$APP/"
          $SSH "$VM_USER@$VM_HOST" "bash /opt/apps/$APP/deploy/remote-deploy.sh $APP"
      - name: Controllo
        run: |
          [ -n "$API_HOST" ] || API_HOST="$APP.${VM_HOST//./-}.sslip.io"
          for i in $(seq 1 30); do curl -fsS "https://$API_HOST/health" && exit 0; sleep 6; done
          echo "L'API non risponde su https://$API_HOST/health" && exit 1
