# Render Blueprint — Infrastructure as Code per DressIt.
# Render legge questo file dal repo GitHub e crea/aggiorna DB, API e frontend.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: dressit-db
    databaseName: dressit
    user: dressit
    plan: free            # Attenzione: il Postgres free scade dopo 30 giorni. In produzione usa basic-256mb o superiore.
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []       # Solo connessioni interne alla rete Render

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: dressit-api
    runtime: node
    # Free: va in sleep dopo 15 min senza traffico. Il workflow
    # .github/workflows/keep-alive.yml lo tiene sveglio con un ping ogni 10 minuti.
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npm run build
    # Applica le migration SQL e poi avvia il server (funziona anche sul piano free,
    # dove preDeployCommand non è disponibile).
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dressit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false        # Render la chiede alla creazione del Blueprint
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ADMIN_EMAILS
        sync: false        # Email degli amministratori, separate da virgola
      - key: CLOUDINARY_URL
        sync: false        # Consigliata: senza, le foto finiscono sul disco effimero di Render
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: dressit-web
          property: host

  # ---------------------------------------------------------------- Frontend
  # Static Site: Next.js esportato in HTML/JS statici e servito dalla CDN di Render.
  # È gratuito, non va mai in sleep e non consuma ore del piano free.
  - type: web
    name: dressit-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - apps/web/**
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), geolocation=(self)
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Host dell'API (es. dressit-api.onrender.com): il client aggiunge https://.
      # È una variabile NEXT_PUBLIC_*: viene inserita nel bundle durante la build.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dressit-api
          property: host
